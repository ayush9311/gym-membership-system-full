<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Plan</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- HEADER -->
<header class="topbar">
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-badge">🏋</div>
            <div>Titan Fitness Hub</div>
        </div>
    </div>
</header>

<div class="container form-container">

    <h2>Create Membership Plan</h2>
    <p class="form-subtext">Define pricing and duration for your gym members.</p>

    <form th:action="@{/plans/save}" method="post" th:object="${plan}" class="form-card">

        <div class="form-group">
            <label>Plan Name</label>
            <input type="text" th:field="*{planName}" placeholder="e.g. Gold / Premium Plan" required>
        </div>

        <div class="form-group">
            <label>Duration (Months)</label>
            <input type="number" th:field="*{durationInMonths}" placeholder="e.g. 3, 6, 12" required>
        </div>

        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" th:field="*{price}" placeholder="Enter price" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" th:field="*{description}" placeholder="Optional plan details">
        </div>

        <div class="form-actions">
            <button class="btn btn-primary">Save Plan</button>
            <a class="btn btn-secondary" th:href="@{/plans}">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
