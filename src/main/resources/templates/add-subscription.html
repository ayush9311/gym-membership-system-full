<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Subscription</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-badge">🏋</div>
            <div>Titan Fitness Hub</div>
        </div>
    </div>
</header>

<div class="container form-container">

    <h2>Edit Subscription</h2>
    <p class="form-subtext">Modify membership details.</p>

    <form th:action="@{/subscriptions/update/{id}(id=${subscription.id})}" 
          method="post" 
          th:object="${subscription}" 
          class="form-card">

        <div class="form-group">
            <label>Member</label>
            <select th:field="*{member}">
                <option th:each="m : ${members}" 
                        th:value="${m}" 
                        th:text="${m.fullName}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Plan</label>
            <select th:field="*{plan}">
                <option th:each="p : ${plans}" 
                        th:value="${p}" 
                        th:text="${p.planName}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Start Date</label>
            <input type="date" th:field="*{startDate}">
        </div>

        <div class="form-group">
            <label>End Date</label>
            <input type="date" th:field="*{endDate}">
        </div>

        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}">
                <option value="ACTIVE">Active</option>
                <option value="EXPIRED">Expired</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Status</label>
            <select th:field="*{paymentStatus}">
                <option value="PAID">Paid</option>
                <option value="PENDING">Pending</option>
            </select>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary">Update Subscription</button>
            <a class="btn btn-secondary" th:href="@{/subscriptions}">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
