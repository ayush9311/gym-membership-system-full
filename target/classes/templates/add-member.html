<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Member</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <div class="nav-inner">
        <div class="brand">
            <div class="brand-badge">🏋</div>
            <div>Titan Fitness Hub</div>
        </div>
    </div>
</header>

<div class="container form-container">

    <h2>Add New Member</h2>
    <p class="form-subtext">Register a new member in the system.</p>

    <form th:action="@{/members/save}" method="post" th:object="${member}" class="form-card">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" th:field="*{fullName}" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" th:field="*{phone}" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" th:field="*{age}" placeholder="Enter age">
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select th:field="*{gender}">
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
            </select>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary">Save Member</button>
            <a class="btn btn-secondary" th:href="@{/members}">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
